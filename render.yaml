# Render Blueprint Specification
# Use this file to deploy the project to Render automatically.
# You can import it directly via the Render Dashboard.

services:
  # Native Static Site (Highly Recommended - Free, served via global CDN)
  - type: web
    name: elearning-frontend-static
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist/elearning-frontend-spa/browser"
    routes:
      # Rewrite all routing paths to index.html to support Angular's SPA client-side routing
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    headers:
      # 1. Never cache HTML files (ensures browsers always load the latest build files)
      - path: "/*.html"
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      - path: "/*.html"
        name: Pragma
        value: no-cache
      - path: "/*.html"
        name: Expires
        value: "0"
      # 2. Cache hashed static assets forever (1 year)
      - path: "/*.js"
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: "/*.css"
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: "/assets/*"
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: "/media/*"
        name: Cache-Control
        value: public, max-age=31536000, immutable

