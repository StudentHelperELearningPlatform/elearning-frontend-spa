name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test -- --watch=false --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (production config)
        run: npm run build -- --configuration production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test
    # Non-blocking: SonarCloud failures (auth, config, network) should not gate the rest of CI.
    # Flip back to default once the underlying SonarCloud project config is stable.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Verify SONAR_TOKEN is set
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN secret is not set! Go to repo Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          else
            echo "SONAR_TOKEN is set (length: ${#SONAR_TOKEN})"
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Pre-flight: directly hit SonarCloud with the token so a bad token / wrong org
      # surfaces as a concrete HTTP status instead of a bare HttpException later.
      - name: Pre-flight SonarCloud auth + project lookup
        run: |
          set +e
          echo "── /api/authentication/validate ──"
          AUTH_STATUS=$(curl -s -o /tmp/auth.json -w "%{http_code}" \
            -u "${SONAR_TOKEN}:" \
            https://sonarcloud.io/api/authentication/validate)
          echo "HTTP ${AUTH_STATUS}"
          cat /tmp/auth.json; echo

          echo "── /api/project_analyses/search?project=${SONAR_PROJECT_KEY} ──"
          PROJ_STATUS=$(curl -s -o /tmp/proj.json -w "%{http_code}" \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/project_analyses/search?project=${SONAR_PROJECT_KEY}")
          echo "HTTP ${PROJ_STATUS}"
          cat /tmp/proj.json; echo

          if [ "${AUTH_STATUS}" != "200" ]; then
            echo "::warning::SonarCloud token did not validate (HTTP ${AUTH_STATUS}). Rotate SONAR_TOKEN in GitHub repo secrets."
          fi
          if [ "${PROJ_STATUS}" = "404" ]; then
            echo "::warning::SonarCloud project '${SONAR_PROJECT_KEY}' not found. Check sonar.projectKey / sonar.organization in sonar-project.properties."
          fi
          # Never fail the workflow on pre-flight — diagnostics only.
          exit 0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: StudentHelperELearningPlatform_elearning-frontend-spa

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          # -X enables debug logging so future HttpExceptions print the actual
          # HTTP status code and response body instead of a bare stack trace.
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.scanner.skipJreProvisioning=true
            -X
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io