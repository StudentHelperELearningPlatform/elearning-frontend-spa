sonar.projectKey=StudentHelperELearningPlatform_elearning-frontend-spa
sonar.organization=studenthelperelearningplatform
sonar.host.url=https://sonarcloud.io

# Skip JRE auto-provisioning (SonarScanner 7.x feature) — runner already has Java 17
sonar.scanner.skipJreProvisioning=true

sonar.sources=src
sonar.exclusions=src/**/*.spec.ts,src/**/*.test.ts,src/test-setup.ts,src/environments/**,e2e/**,src/main.ts,src/mocks/**

sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts,src/**/*.test.ts

sonar.typescript.lcov.reportPaths=coverage/lcov.info
